# NPS — snapshot asistido desde Amplitude (6_rd.j2, slide "NPS Alegra Accounting")
#
# fetch_metrics.py no puede llamar al MCP de Amplitude directamente (solo existe dentro de
# una sesión de Claude Code) — decisión del usuario 2026-07-06: actualizar este YAML una vez
# al mes en una sesión de Claude en vez de tomar screenshots. Ver Template Board/CLAUDE.md
# sección "Template 6 — NPS" para el procedimiento exacto y el mapeo chart→campo.
#
# Dashboard fuente: https://app.amplitude.com/analytics/alegra/dashboard/jvmfiss8
# ("Performance NPS Alegra All products", appId 496026 "Alegra - Production")
#
# Estructura por mes (YYYY-MM):
#   score: NPS global del mes (chart "Evolutivo NPS general", te3hpyxp) — null si no hay dato.
#   responses: total de respuestas del mes (opcional, solo si se consultó ese mes puntual).
#   distribution: {promoters_pct/n, passives_pct/n, detractors_pct/n} (chart 1yhusamz).
#   by_country: {colombia, mexico, dom_rep, costa_rica} — NPS score por país
#     (charts o1t24q2y=Colombia, sx2n44r0=Mexico, 6rkocooq=Dom.Rep, k67mnwk8=Costa Rica)
#   by_country_n: {mexico, dom_rep, costa_rica} — SOLO cuando se documentó el n real de ese
#     país ese mes (Colombia nunca se marca, es siempre la muestra grande/de referencia). El
#     template usa esto para el badge "n=X" + barra rayada — no implica automáticamente que
#     sea una muestra "chica" en términos estadísticos, solo que el n quedó documentado.
#   context: nota editorial corta (1 frase) — el "por qué" cualitativo detrás del número, para
#     meses sin mes anterior comparable o con algo que el delta solo no explica. El delta
#     (flecha + pp vs mes anterior) SIEMPRE se calcula solo de los scores, nunca a mano —
#     "context" es un complemento, no reemplaza el cálculo. Puede quedar "" si no hace falta.
#
# REDISEÑO 2026-08-18 — tendencia histórica interactiva (antes: solo el mes de corte + 4
# tarjetas MoM estáticas). Ver `templates/6_rd.j2` y `_build_nps()` en `fetch_metrics.py`.
# Feedback recibido: la slide vieja mostraba un solo número grande sin contexto de para dónde
# iba. Ahora la slide es interactiva — tabs por mes (ventana móvil de los últimos 7 meses
# hasta el mes de corte), con un gráfico de tendencia y un panel de detalle que se actualiza al
# hacer click en cualquier tab. Consecuencia importante: un mes SIN dato real (como julio-26,
# ver abajo) ya NO se maneja omitiendo la entrada del YAML — se escribe explícita con los
# campos en null, así aparece su propio tab mostrando el hueco ("sin dato") en vez de tapar
# toda la slide con un overlay. F0.10/F3.7 (`month in snap`) siguen funcionando igual sin
# tocar código — pasan en cuanto existe la entrada, aunque sea en null.
#
# Distribution/responses completos hacen falta para CUALQUIER mes que se quiera poder abrir
# en un tab con el detalle completo (antes solo hacía falta para el mes de corte) — por eso
# ene/feb-26 ya se trajeron completos también (ver más abajo), no solo el score.
#
# CÓMO SACAR ESTO DE AMPLITUDE (2026-07-24, ya 100% automatizable, sin screenshots):
# Los charts de este dashboard usan metric="formula" (NPS = %promotores - %detractores vía
# TOTALS(A..F)) — esa fórmula NO se evalúa bien corriéndola vía query_dataset/query_charts del
# MCP (da valores imposibles, ej. 977 en vez de 60.9 — probado y descartado). La forma que SÍ
# funciona: pedir los 6 componentes crudos por separado con metric="uniques" (sin fórmula) e
# interval=30 (mensual — con interval=1/diario devuelve PROMEDIOS por día, no el total del
# mes) y calcular la fórmula uno mismo:
#   A = Survey Submitted, Survey Response in (0-6)      [detractores, canal G&S]
#   B = Survey Submitted, Survey Response in (0-10)     [total, canal G&S]
#   C = Survey Submitted, Survey Response in (9-10)      [promotores, canal G&S]
#   D = nps-survey-response, response in (1-6)           [detractores, canal Bandeja/inbox]
#   E = nps-survey-response, response in (0-10)          [total, canal Bandeja/inbox]
#   F = nps-survey-response, response in (9-10)          [promotores, canal Bandeja/inbox]
#   score = (C+F)/(B+E)*100 - (A+D)/(B+E)*100
#   responses = B+E ; promoters_n = C+F ; detractors_n = A+D ; passives_n = responses - promoters_n - detractors_n
# Para by_country, agregar el segmento gp:appVersion is [colombia,COL] / [mexico,MEX] /
# [rdominicana,republicaDominicana,DOM] / [costarica,costaRica,CRI] a los mismos 6 eventos
# (mismos filtros que los charts o1t24q2y/sx2n44r0/6rkocooq/k67mnwk8, ver sus definiciones).
# Validado contra la UI de Amplitude con el filtro Jun 1-30 2026 puesto a mano: coincide.

