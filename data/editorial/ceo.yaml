# CEO Highlights & Lowlights — Agosto 2026 (September MBR)
updated_for_month: "2026-08"

ceo_title: "CEO Highlights & Lowlights"

highlights:
  - "Global logo churn improved to 3.8% from 3.9%, sustaining the favorable trend of recent months with a projected reduction in Churn MRR."
  - "Organic channels are now growing on their own, with SEO, Direct Traffic and Lead Nurturing expanding logos in parallel (+13%, +5%, +21%), shifting organic from a fallback to a primary growth engine."
  - "Mexico's ICP is now defined, focusing product and go-to-market priorities in a market where paid acquisition efficiency is the binding constraint."
  - "Catalog migration is now fully covered in Mexico. Aspel and Contalink were closed with AI that rebuilds and corrects the accounting catalog, completing the three migration routes of the market alongside Contapaq."
  - "Alegra won the Digital Transformation category at Premios Portafolio 2026, one of Colombia's most established business awards, with 10 tier-1 press placements reinforcing our positioning as a technology-led platform in the market."
  - "Customer Success strategy launched with a pilot in Mexico, with over 50 users through the model in its first three weeks and a focus on reducing churn within the first 3 months of the lifecycle."

lowlights:
  - "Accountant activation dropped 10 pp, from 43% to 33%, as newly onboarded accountants are not being activated immediately within the Alegra Impulsa flow."
  - "Top-of-funnel volume is not translating into logos. Colombia delivered 86% of its Contactables target but only 54% of Logos, while Mexico delivered 150% of Contactables and 71% of Logos."
  - "Global Agent adoption remains close to zero after two months in beta, with limited movement during August and only a partial recovery in the final week."
  - "Nurturing flow activation and lead scoring errors disrupted conversation assignment during the first two weeks of August, running close to $3K USD below the weekly average before recovering."

financial_update: "August delivered another strong month, with revenue of $2.86M coming in 13.4% ahead of budget and up 42.1% year over year, while gross margin held steady at 81.4%. EBITDA reached $353K, nearly three times the budgeted $123K, for a 12.3% margin. Cash closed at $4.98M, the highest balance of the year and well above plan, supported by seven straight months of positive net change. Year to date, operating expenses have fallen to 70.4% of revenue from 89.5% a year ago, and ARR now stands at $34.7M, growing 44.4% year over year. Holding budget through year end, we project FY26 revenue of $30.8M and EBITDA of $3.4M, both comfortably ahead of plan."

