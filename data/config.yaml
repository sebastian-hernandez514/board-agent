# Board configuration — update each month
period:            "2026-08"       # YYYY-MM del período activo
month:             "August"        # Mes corto, usado por 1_inicio.j2 ("net adds {{ config.month }}") —
                                    # bug preexistente encontrado 2026-09-18: esta key nunca existió,
                                    # el campo rendereaba en blanco desde siempre (verificado en v1 de
                                    # agosto y en el git history de este archivo, nunca se agregó antes)
month_label:       "August 2026"   # Mes en inglés, largo
prev_month_label:  "July 2026"     # Mes anterior (para comparaciones MoM)
quarter_label:     "3Q26"          # Quarter del período activo
prev_year:         "2025"          # Año anterior (para comparaciones YoY)
year:              2026            # Año actual

# Decisión editorial 2026-09-22: NPS no se publica este mes (no es un dato desactualizado,
# es a propósito) — la slide se elimina por completo, sin overlay ni rastro (ver F3.7 en
# board_agent/slide_registry.py). Quitar esta línea (o el "nps" de la lista) el mes que se
# quiera volver a mostrar — este archivo se reescribe entero cada mes, así que el flag no
# sobrevive solo a septiembre.
hide_slides: ["nps"]
